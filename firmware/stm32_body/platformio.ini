; STM32 "body" controller: WeAct Black Pill V3.x (STM32F411CEU6, 25 MHz crystal)
;
;   pio run                      build
;   pio run -t upload            flash over ST-Link (SWDIO/SWCLK/GND/3V3 header)
;   pio run -e dfu -t upload     flash over USB-C: hold BOOT0, tap NRST, release BOOT0
;   pio device monitor           there's no USB serial here; debug prints go to the ESP32 link
;
; The rover logic lives in ros2_ws/src/rover_core and is shared with the
; ESP32 firmware and the laptop simulator.

[platformio]
default_envs = blackpill

[env]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -I ../../ros2_ws/src/rover_core/include
    -DHSE_VALUE=25000000U
    -Wall
    -Wextra
    -Wdouble-promotion
    -fno-exceptions
    -fno-rtti
upload_protocol = stlink
debug_tool = stlink

[env:blackpill]

[env:dfu]
upload_protocol = dfu
