; ESP32 "brain": a ROS 2 node (micro-ROS over WiFi) that runs the mission,
; the path follower and obstacle avoidance, and drives the STM32 over UART.
;
; Before the first build:
;   cp include/wifi_secrets.example.h include/wifi_secrets.h   and fill it in
;
;   pio run -t upload && pio device monitor
;
; The first build takes a while (5-10 min) because micro_ros_platformio
; compiles the micro-ROS client library for the chosen ROS 2 distro. You
; need git, cmake and python3-venv on the build machine for that step.

[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_microros_distro = jazzy
board_microros_transport = wifi
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I ../../ros2_ws/src/rover_core/include
